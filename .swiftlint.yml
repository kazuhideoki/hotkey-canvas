included:
  - Sources
  - Tests

disabled_rules:
  - trailing_comma

excluded:
  - .build
  - .codex

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_cast
  - force_unwrapping
  - sorted_imports
  - vertical_parameter_alignment_on_call

line_length:
  warning: 120
  error: 150

opening_brace:
  ignore_multiline_statement_conditions: true

type_name:
  min_length: 2
  max_length:
    warning: 50
    error: 60

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 15
  error: 20

empty_count:
  severity: error

force_cast:
  severity: error

force_unwrapping:
  severity: error

custom_rules:
  no_any_type:
    name: "No Any Type"
    regex: "\\bAny\\b"
    message: "`Any` is prohibited. Use a concrete type, `any Protocol`, or generics."
    severity: error
    match_kinds:
      - identifier
  no_throw_in_domain:
    name: "No Throw In Domain"
    included:
      - Sources/Domain
    regex: "\\b(throw|throws|rethrows)\\b"
    message: "Domain layer must not use throw/throws. Use Result-based modeling."
    severity: error
    match_kinds:
      - keyword
  no_bare_numeric_return:
    name: "No Bare Numeric Return"
    included:
      - Sources
    regex: "^\\s*return\\s+\\d{2,}(?:_?\\d)*(?:\\.\\d+)?\\s*$"
    message: "Meaningful numeric return values must use a named constant."
    severity: warning
  no_numeric_default_argument:
    name: "No Numeric Default Argument"
    included:
      - Sources
    regex: "\\b(?:func\\s+[A-Za-z_][A-Za-z0-9_]*|init)\\([^\\n)]*=\\s*\\d{2,}(?:_?\\d)*(?:\\.\\d+)?"
    message: "Meaningful numeric default arguments must use a named constant."
    severity: warning
